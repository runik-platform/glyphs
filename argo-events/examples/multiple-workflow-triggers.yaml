name: multiple-workflow-triggers

spellbook:
  name: example-book
chapter:
  name: automation

lexicon:
  automation-eventbus:
    type: event-bus
    labels:
      purpose: automation
      default: book

  forgejo-source:
    type: event-source
    eventName: forgejo
    labels:
      source: forgejo

  build-reading:
    type: tarot-reading
    labels:
      process: build
      version: v1
    scope: namespace
    namespace: builds

  bootstrap-reading:
    type: tarot-reading
    labels:
      process: bootstrap
      version: v1
    scope: namespace
    namespace: bootstrap

  build-trigger:
    type: workflow-trigger
    sensorSelector:
      purpose: workflow-execution
    readingSelector:
      process: build
      version: v1
    filters:
      exprs:
        - expr: event_type == "push"
          fields:
            - name: event_type
              path: header.X-Gitea-Event.0

  bootstrap-trigger:
    type: workflow-trigger
    sensorSelector:
      purpose: workflow-execution
    readingSelector:
      process: bootstrap
      version: v1
    filters:
      exprs:
        - expr: event_type == "repository" && action == "created"
          fields:
            - name: event_type
              path: header.X-Gitea-Event.0
            - name: action
              path: body.action

glyphs:
  argo-events:
    workflow-sensor:
      type: sensor
      labels:
        purpose: workflow-execution
      selector:
        purpose: automation
      eventSourceSelector:
        source: forgejo
      template:
        serviceAccountName: workflow-sensor
