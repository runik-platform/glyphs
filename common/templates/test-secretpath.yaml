{{/*Runik Platform
Copyright (C) 2025 laaledesiempre@disroot.org
SPDX-License-Identifier: AGPL-3.0-only

Executable common examples. Dispatch-only templates generate ConfigMaps with
helper outputs; this file emits no resources by itself.
*/}}
{{- define "common.test-path" }}
{{- $root := index . 0 }}
{{- $glyphDefinition := index . 1 }}

{{- /* Build options dict */ -}}
{{- $options := dict "store" (default dict $glyphDefinition.store) }}
{{- if $glyphDefinition.excludeName }}
  {{- $options = merge $options (dict "excludeName" true) }}
{{- end }}

{{- /* Get basePath from glyph definition */ -}}
{{- $basePath := default "" $glyphDefinition.basePath }}

{{- /* Generate secret path using common.secretPath */ -}}
{{- $secretPath := include "common.secretPath" (list $root $glyphDefinition $basePath $options) }}
{{- if and (hasKey $glyphDefinition "expectedPath") (ne $secretPath $glyphDefinition.expectedPath) }}
  {{- fail (printf "common path example %s: expected %q, got %q" $glyphDefinition.name $glyphDefinition.expectedPath $secretPath) }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "test-path-%s" ($glyphDefinition.name | default "no-name") }}
  labels:
    test: secretpath
data:
  generatedPath: {{ $secretPath | quote }}
  inputName: {{ $glyphDefinition.name | quote }}
  inputPath: {{ default "" $glyphDefinition.path | quote }}
  inputBasePath: {{ $basePath | quote }}
  inputVisibility: {{ default "publics" $glyphDefinition.private | quote }}
{{- end }}

{{/*
Example renderer for the named-argument helpers, using the existing common
example/ConfigMap pattern. Expected outputs fail the render on regressions,
even when candidate CI regenerates snapshots. Not emitted unless dispatched.
*/}}
{{- define "common.test-helpers" -}}
{{- $root := deepCopy (index . 0) -}}
{{- $case := index . 1 -}}
{{- if hasKey $case "values" -}}{{- $_ := set $root "Values" (deepCopy $case.values) -}}{{- end -}}
{{- $before := toJson $root.Values -}}
{{- $caseBefore := toJson $case -}}
{{- $actual := dict -}}
{{- if eq $case.helper "name" -}}
  {{- $name := include "common.glyph.name" (dict "root" $root "glyph" $case.glyph "options" $case.options) -}}
  {{- if ne $name $case.expectedName -}}
    {{- fail (printf "common example %s: expected name %q, got %q" $case.name $case.expectedName $name) -}}
  {{- end -}}
  {{- $_ := set $actual "name" $name -}}
{{- else if eq $case.helper "metadata" -}}
  {{- $labels := include "common.metadata.labels" (dict "root" $root "local" $case.labels "generated" $case.generatedLabels) | fromJson -}}
  {{- $annotations := include "common.metadata.annotations" (dict "root" $root "local" $case.annotations "generated" $case.generatedAnnotations) | fromJson -}}
  {{- $selectors := include "common.metadata.selectorLabels" (dict "root" $root) | fromJson -}}
  {{- range $key, $expected := $case.expectedLabels -}}
    {{- if ne (get $labels $key) $expected -}}
      {{- fail (printf "common example %s: label %s must equal %q" $case.name $key $expected) -}}
    {{- end -}}
  {{- end -}}
  {{- if ne (toJson $annotations) (toJson $case.expectedAnnotations) -}}
    {{- fail (printf "common example %s: unexpected annotations %s" $case.name (toJson $annotations)) -}}
  {{- end -}}
  {{- $legacySelectors := include "common.selectorLabels" $root | fromYaml -}}
  {{- if ne (toJson $selectors) (toJson $legacySelectors) -}}
    {{- fail (printf "common example %s: selector identity changed" $case.name) -}}
  {{- end -}}
  {{- $_ := set $actual "labels" (toJson $labels) -}}
  {{- $_ := set $actual "annotations" (toJson $annotations) -}}
  {{- $_ := set $actual "selectors" (toJson $selectors) -}}
{{- else -}}
  {{- fail "common.test-helpers: helper must be name or metadata" -}}
{{- end -}}
{{- if or (ne $before (toJson $root.Values)) (ne $caseBefore (toJson $case)) -}}
  {{- fail (printf "common example %s: helper modified its inputs" $case.name) -}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $case.name }}
data:
  {{- toYaml $actual | nindent 2 }}
{{- end -}}
