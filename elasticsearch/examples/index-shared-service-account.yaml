# A spell-specific Vault role bound to a chapter-wide Kubernetes identity.
name: fulltext
chapter:
  name: huly
spellbook:
  name: test-book
lexicon:
  elastic-infra:
    type: elasticsearch
    namespace: elastic-infra
    host: elastic-infra-es-http.elastic-infra.svc
    port: "9200"
    engineServiceAccount: elastic-infra
    engineAuthRole: elastic-infra
    tls:
      enabled: false
    labels:
      default: book
  vault:
    type: secret-store
    provider: operator
    url: http://vault.vault.svc:8200
    namespace: vault
    authPath: test-book
    secretPath: secret
    labels:
      default: book
glyphs:
  elasticsearch:
    search:
      type: index
      indexName: huly-production
      serviceAccount: huly
      authRole: fulltext
  vault:
    access:
      type: prolicy
      serviceAccount: huly
    unrelated:
      type: prolicy
      nameOverride: metrics
      serviceAccount: huly
