name: externalsecrets-basic-test

lexicon:
  - name: vault-store
    chapter: base-system
    skipVerify: true
    type: secret-store
    provider: vault
    mode: cluster
    url: http://vault.vault.svc:8200
    namespace: vault
    serviceAccount: vault
    authPath: k8s-path-auth
    secretPath: kv
    labels:
      default: book

  # Secret store in AWS (w labels)
  - name: aws-store
    type: secret-store
    mode: cluster
    provider: aws
    labels:
      environment: prod
      hosted: cloud

  - name: rooted-vault-store
    type: secret-store
    provider: vault
    mode: cluster
    pathRoot: acme/prod
    secretPath: kv
    labels:
      tenant: acme

  - name: rooted-aws-store
    type: secret-store
    provider: aws
    mode: cluster
    pathRoot: acme/prod
    secretPath: kv
    labels:
      tenant: acme

  - name: rooted-gcp-store
    type: secret-store
    provider: gcp
    mode: cluster
    pathRoot: acme/prod
    secretPath: kv
    labels:
      tenant: acme

glyphs:
  external-secrets:
    # Secret Store (Cluster-wide)
    - type: secret-store
      mode: cluster
      name: vault-store
      provider:
        type: vault
        selector:
          provider: vault
          default: book

    # External Secret with inline data mapping
    - type: push-secret
      name: app-config
    - type: push-secret
      name: custom-length
      password:
        length: "jorge"
        digits: "jorge"
        symbols: "jorge"
        symbolCharacters: "jorge"
        repeat: "false"
    - type: push-secret
      name: vault-provider
      selector:
        provider: vault
    - type: push-secret
      name: aws-provider
      selector:
        environment: prod
        hosted: cloud
    - type: push-secret
      name: custom-path
      path: /foo/bar
    # Publish an existing Secret rather than invoking another generator.
    - type: push-secret
      name: existing-pg-credentials
      sourceSecret: pg-app
      selector:
        provider: aws
      updatePolicy: Replace
      deletionPolicy: None
      data:
        - match:
            remoteRef:
              remoteKey: example/postgresql/app
    - type: external-secret
      name: rooted-vault-credentials
      selector:
        provider: vault
        tenant: acme
    - type: push-secret
      name: rooted-vault-credentials
      selector:
        provider: vault
        tenant: acme
    - type: external-secret
      name: rooted-aws-credentials
      selector:
        provider: aws
        tenant: acme
    - type: push-secret
      name: rooted-aws-credentials
      selector:
        provider: aws
        tenant: acme
    - type: external-secret
      name: rooted-gcp-credentials
      selector:
        provider: gcp
        tenant: acme
    - type: push-secret
      name: rooted-gcp-credentials
      selector:
        provider: gcp
        tenant: acme
    # Explicit keys and paths continue to bypass the root convention.
    - type: external-secret
      name: rooted-explicit-key
      selector: {provider: aws, tenant: acme}
      data:
        - secretKey: token
          remoteRef: {key: shared/token}
    - type: external-secret
      name: rooted-chapter-data
      selector: {provider: aws, tenant: acme}
      path: chapter
      data:
        - secretKey: token
    - type: external-secret
      name: rooted-explicit-extract
      selector: {provider: vault, tenant: acme}
      dataFrom:
        - extract: {key: shared/token}
    - type: push-secret
      name: rooted-explicit-push
      selector: {provider: aws, tenant: acme}
      path: shared/token
    - type: push-secret
      name: rooted-chapter-data
      selector: {provider: aws, tenant: acme}
      path: chapter
