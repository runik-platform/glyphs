name: externalsecrets-secretstore-variants

# Different SecretStore configurations
# Shows namespace-scoped vs cluster-scoped stores, different auth methods

lexicon:
  - name: vault-cluster-store
    chapter: base-system
    skipVerify: true
    type: secret-store
    provider: vault
    mode: cluster
    url: http://vault.vault.svc:8200
    namespace: vault
    serviceAccount: vault
    authPath: k8s-path-auth
    secretPath: kv
    labels:
      default: book

  - name: vault-namespace-store
    type: secret-store
    provider: vault
    mode: ""
    url: http://vault.vault.svc:8200
    namespace: vault
    serviceAccount: vault
    authPath: k8s-path-auth
    secretPath: kv
    labels:
      scope: namespace
  
  - name: vault-custom-auth
    type: secret-store
    provider: vault
    mode: cluster
    url: http://vault-alternate.vault.svc:8200
    namespace: vault
    serviceAccount: vault
    authPath: k8s-custom
    secretPath: secret
    labels:
      auth: custom

  - name: vault-token-auth
    type: secret-store
    provider: vault
    mode: cluster
    url: http://vault.vault.svc:8200
    namespace: vault
    serviceAccount: vault
    authPath: k8s-path-auth
    secretPath: kv
    labels:
      auth: token

glyphs:
  external-secrets:
    # Cluster-scoped SecretStore (default)
    - type: secret-store
      mode: cluster
      name: vault-cluster-store
      provider:
        type: vault
        selector:
          provider: vault
          default: book

    # Namespace-scoped SecretStore
    - type: secret-store
      mode: ""  # Empty mode = SecretStore (namespace-scoped)
      name: vault-namespace-store
      provider:
        type: vault
        selector:
          provider: vault
          scope: namespace

    # SecretStore with custom Kubernetes auth
    - type: secret-store
      mode: cluster
      name: vault-custom-auth
      provider:
        type: vault
        selector:
          provider: vault
          auth: custom
        config:
          server: http://vault-alternate.vault.svc:8200
          path: secret
          auth:
            kubernetes:
              mountPath: k8s-custom
              role: custom-role
              serviceAccountRef:
                name: custom-sa
                namespace: custom-namespace

    # SecretStore with token auth (from secret)
    - type: secret-store
      mode: cluster
      name: vault-token-auth
      provider:
        type: vault
        selector:
          provider: vault
          auth: token
        config:
          server: http://vault.vault.svc:8200
          path: kv
          auth:
            tokenSecretRef:
              name: vault-token
              key: token
              namespace: vault

    # ExternalSecrets using different stores

    # Uses cluster store (default)
    - type: external-secret
      name: uses-cluster-store
      selector:
        provider: vault
        default: book
      path: chapter

    # Uses specific namespace store
    - type: external-secret
      name: uses-namespace-store
      selector:
        provider: vault
        scope: namespace
      path: chapter

    # Uses custom auth store
    - type: external-secret
      name: uses-custom-auth
      selector:
        provider: vault
        auth: custom
      path: /custom/path
