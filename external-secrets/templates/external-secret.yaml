{{- define "external-secrets.external-secret" }}
{{- $root := index . 0 -}}
{{- $glyphDefinition := index . 1}}

{{- $secretStore := dict }}
{{- if not $glyphDefinition.generatorRef }}
{{- $secretStores := get (include "runic-system.runic-indexer" (list $root.Values.lexicon (default dict $glyphDefinition.selector) "secret-store" $root.Values.chapter.name) | fromJson) "results" }}
{{- if not $secretStores }}{{- fail "external-secrets.external-secret: no matching secret-store entry in lexicon" }}{{- end }}
{{- $secretStore = index $secretStores 0 }}
{{- end }}
{{- $storeName := default (include "common.name" $root) $secretStore.name }}
{{- $storeKind := ternary "ClusterSecretStore" "SecretStore" (eq $secretStore.mode "cluster") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $glyphDefinition.name }}
{{- with $glyphDefinition.namespace }}
  namespace: {{ . }}
{{- end }}
{{- with $glyphDefinition.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with $glyphDefinition.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}

spec:
  {{- if not $glyphDefinition.generatorRef }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ $storeKind }}
  {{- end }}
  refreshPolicy: {{ default "Periodic" $glyphDefinition.refreshPolicy }}
  refreshInterval: {{ default "30m" $glyphDefinition.refreshInterval}}
  target:
    name: {{ default $glyphDefinition.name $glyphDefinition.targetName }}
    creationPolicy: {{ default "Orphan" $glyphDefinition.creationPolicy }}
    deletionPolicy: {{ default "Merge" $glyphDefinition.deletionPolicy }}
  {{- if $glyphDefinition.template }}
  {{- with $glyphDefinition.template }}
    template:
      {{- with .type }}
      type: {{ . }}
      {{- end }}
      {{- with .metadata }}
      metadata:
        {{- with .labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .data }}
      data:
      {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}

  {{- end }}

  {{- if $glyphDefinition.generatorRef }}
  dataFrom:
    - sourceRef:
        generatorRef:
          {{- toYaml $glyphDefinition.generatorRef | nindent 10 }}
  {{- else if $glyphDefinition.data }}
  {{- with $glyphDefinition.data }}
  data:
    {{- range . }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        {{- if (.remoteRef).key }}
        key: {{ (.remoteRef).key }}
        {{- else }}
        key: {{ include "external-secrets.secretPath" (list $root $glyphDefinition $secretStore) }}
        {{- end }}
        property: {{ default .secretKey (.remoteRef).property }}
    {{- end }}
  {{- end }}
  {{- else if $glyphDefinition.dataFrom }}
  dataFrom:
  {{- $glyphDefinition.dataFrom | toYaml | nindent 2 }}
  {{- else }}
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ include "external-secrets.secretPath" (list $root $glyphDefinition $secretStore) }}
    {{- end }}
{{- end }}
