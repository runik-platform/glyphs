{{- define "external-secrets.push-secret" }}
{{- $root := index . 0 -}}
{{- $glyphDefinition := index . 1}}

{{- /* Find SecretStore via runic indexer */ -}}
{{- $secretStores := get (include "runic-system.runic-indexer" (list $root.Values.lexicon (default dict $glyphDefinition.selector) "secret-store" $root.Values.chapter.name) | fromJson) "results" }}
{{- if not $secretStores }}{{- fail "external-secrets.push-secret: no matching secret-store entry in lexicon" }}{{- end }}
{{- $secretStore := index $secretStores 0 }}

{{- $annotations := include "common.annotations.map" (list $root (default dict $glyphDefinition.annotations) dict) | fromJson }}

{{- if not $glyphDefinition.sourceSecret }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password 
metadata:
  name: {{ $glyphDefinition.name }}
spec:  
  length: {{ default "32" ($glyphDefinition.password).length }}
  digits: {{ default "5" ($glyphDefinition.password).digits }}
  symbols: {{ default "5" ($glyphDefinition.password).symbols }}
  symbolCharacters: {{ default "-_@" ($glyphDefinition.password).symbolCharacters }}
  allowRepeat: {{ default "true" ($glyphDefinition.password).repeat }}
{{- end }}
---
apiVersion: external-secrets.io/v1alpha1
kind: {{ default "" $glyphDefinition.mode | title }}PushSecret
metadata:
  name: {{ $glyphDefinition.name }}
  {{- with $glyphDefinition.namespace }}
  namespace: {{ . }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ default "60m0s" $glyphDefinition.refreshInterval}}
  {{- with $glyphDefinition.updatePolicy }}
  updatePolicy: {{ . }}
  {{- end }}
  {{- with $glyphDefinition.deletionPolicy }}
  deletionPolicy: {{ . }}
  {{- end }}
  secretStoreRefs:
    - name: {{ default (include "common.name" $root) $secretStore.name }}          
      kind: {{ default "" $secretStore.mode | title }}SecretStore
  selector:
    {{- if $glyphDefinition.sourceSecret }}
    secret:
      name: {{ $glyphDefinition.sourceSecret }}
    {{- else }}
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: {{ $glyphDefinition.name }}
    {{- end }}
  
  data: 
    {{- if $glyphDefinition.data }}
    {{- toYaml $glyphDefinition.data | nindent 4 }}
    {{- else }}
    - match:
        secretKey: {{ default "password" $glyphDefinition.randomKey }}
        remoteRef:
          {{- /* Legacy PushSecret treats path as a literal key. With pathRoot,
          book/chapter opt into the same scope grammar as ExternalSecret. */}}
          {{- if and $glyphDefinition.path (not (and (hasKey $secretStore "pathRoot") (has $glyphDefinition.path (list "book" "chapter")))) }}
          remoteKey: {{ $glyphDefinition.path }}
          {{- else }}
          remoteKey: {{ include "external-secrets.secretPath" (list $root $glyphDefinition $secretStore) }}
          {{- end }}
    {{- end }}
  {{- end}}
