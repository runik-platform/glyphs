spellbook:
  name: example
chapter:
  name: development

# In a spell this entry is published under appendix.lexicon. It is inlined
# here because kaster examples receive the already-assembled lexicon.
lexicon:
  events:
    type: kafka
    clusterName: events
    namespace: kafka
    bootstrapServers: events-kafka-bootstrap.kafka.svc:9093
    labels:
      default: book

glyphs:
  kafka:
    events:
      type: cluster
      kafka:
        version: 4.3.1
        metadataVersion: 4.3-IV0
        config:
          offsets.topic.replication.factor: 1
          transaction.state.log.replication.factor: 1
          transaction.state.log.min.isr: 1
          default.replication.factor: 1
          min.insync.replicas: 1
        entityOperator:
          topicOperator: {}
          userOperator: {}
