spellbook:
  name: example
chapter:
  name: production

lexicon:
  events:
    type: kafka
    clusterName: events
    namespace: kafka
    bootstrapServers: events-kafka-bootstrap.kafka.svc:9093
    labels:
      default: book

glyphs:
  kafka:
    events:
      type: cluster
      kafka:
        annotations:
          strimzi.io/in-place-resizing: "true"
        version: 4.3.1
        metadataVersion: 4.3-IV0
        listeners:
          - name: tls
            port: 9093
            type: internal
            tls: true
            authentication:
              type: scram-sha-512
        authorization:
          type: simple
        config:
          offsets.topic.replication.factor: 3
          transaction.state.log.replication.factor: 3
          transaction.state.log.min.isr: 2
          default.replication.factor: 3
          min.insync.replicas: 2
        entityOperator:
          topicOperator: {}
          userOperator: {}
        cruiseControl: {}
      nodePools:
        controllers:
          replicas: 3
          roles: [controller]
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 10Gi
                kraftMetadata: shared
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 2Gi}
        brokers:
          replicas: 3
          roles: [broker]
          storage:
            type: jbod
            volumes:
              - id: 0
                type: persistent-claim
                size: 100Gi
                kraftMetadata: shared
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {memory: 4Gi}
