# Primitive composition for an identity whose Secret is managed outside Runik.
# The database claim has no default user; the explicit user is read-only.
name: reporting

spellbook:
  name: platform
chapter:
  name: applications

lexicon:
  mongo-main:
    type: mongodb
    clusterName: mongo-main
    engineName: mongo-main
    namespace: databases
    labels:
      default: book

glyphs:
  mongodb:
    reporting:
      type: database
      defaultUser:
        enabled: false

    reporting-reader:
      type: user
      databaseRef:
        name: reporting
      access: readOnly
      credentials:
        generate: false
      credentialsSecretRef:
        name: reporting-reader-mongodb
        usernameKey: username
        passwordKey: password
      credentialsRevision: "1"
