# Native Group: a single NetBird group, plus a lexicon entry so other
# netbird glyphs can discover it via selector instead of hardcoding the name.

spellbook:
  name: my-app
chapter:
  name: production

lexicon:
  netbird:
    type: netbird-instance
    namespace: netbird
    resourceRef:
      name: default
    labels:
      environment: production
      default: book
  prod-servers:
    type: netbird-group
    name: prod-servers
    labels:
      environment: production
      role: server
      default: book

glyphs:
  netbird:
    prod-servers:
      type: group
      instanceSelector:
        environment: production
