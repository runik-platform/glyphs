# Empty singleton DNS settings explicitly leaves NetBird DNS management enabled
# for every peer.

spellbook:
  name: example-networking
chapter:
  name: production

lexicon:
  netbird:
    type: netbird-instance
    namespace: netbird
    resourceRef:
      name: default
    labels:
      environment: production
      default: book

glyphs:
  netbird:
    account-dns-defaults:
      type: dnsSettings
