# Continuously remove a NetBird-side policy without requiring group refs.

spellbook:
  name: example-networking
chapter:
  name: production

lexicon:
  netbird:
    type: netbird-instance
    namespace: netbird
    resourceRef:
      name: default
    labels:
      environment: production
      default: book

glyphs:
  netbird:
    legacy-default-policy:
      type: policy
      nbName: Default
      state: absent
