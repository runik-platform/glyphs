# NetBirdPostureCheck — enforce minimum NetBird client version and
# geo restrictions.

spellbook:
  name: my-app
chapter:
  name: production

lexicon:
  netbird:
    type: netbird-instance
    namespace: netbird
    resourceRef:
      name: default
    labels:
      environment: production
      default: book

glyphs:
  netbird:
    minimum-version:
      type: postureCheck
      description: Require recent NetBird client and deny non-EU locations
      checks:
        nbVersionCheck:
          minVersion: "0.30.0"
        geoLocationCheck:
          action: deny
          locations:
            - countryCode: RU
            - countryCode: CN
