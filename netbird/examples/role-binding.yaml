# NetBirdRoleBinding — promotes exact members of an existing NetBird group to
# the internal admin role. The group may be preprovisioned by identitySync; in
# this example it is resolved through the lexicon.

spellbook:
  name: my-app
chapter:
  name: production

lexicon:
  netbird:
    type: netbird-instance
    namespace: netbird
    resourceRef:
      name: default
    labels:
      environment: production
      default: book
  vpn-admins:
    type: netbird-group
    name: vpn-admins
    labels:
      access: admin
      default: book

glyphs:
  netbird:
    vpn-admins:
      type: roleBinding
      namespace: netbird
      groupSelector:
        access: admin
      role: admin
      revokeOnExit: true
      restoreOnDelete: true
      includeServiceUsers: false
      pollIntervalSeconds: 60
