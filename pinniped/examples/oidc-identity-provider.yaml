spellbook:
  name: pinniped-example
chapter:
  name: production

glyphs:
  pinniped:
    keycloak:
      type: oidcIdentityProvider
      namespace: pinniped-supervisor
      labels:
        app.kubernetes.io/part-of: pinniped
      spec:
        issuer: https://sso.example.com/realms/workforce
        authorizationConfig:
          additionalScopes:
            - email
            - profile
            - groups
        claims:
          username: preferred_username
          groups: groups
        client:
          secretName: keycloak-oidc-client
