spellbook:
  name: test-postgresql
  chapters:
    - databases

chapter:
  name: databases

# Lexicon entry that the meta `type: cluster` needs to locate the S3
# provider. In production this is supplied by the VersityGW spell;
# here we inline it so the snapshot is self-contained.
lexicon:
  vault:
    type: secret-store
    provider: operator
    name: vault
    url: http://vault.vault.svc:8200
    namespace: vault
    serviceAccount: vault
    authPath: test-postgresql
    secretPath: kv
    labels:
      default: book
  versity-s3-provider:
      type: s3-provider
      name: gateway
      namespace: s3
      serviceAccount: gateway-s3-aggregator-pod
      role: gateway-s3-identities
      endpoint: https://s3.example.test
      internalEndpoint: http://s3.s3.svc:7070
      region: us-east-1
      vault:
        path: /s3-identities
      provider: versity
      labels:
        default: book
      # Note: in a real bookrack this lexicon entry comes from the
      # VersityGW spell's appendix.lexicon and gets merged in by librarian.
      # For this standalone glyph render we inline it at the top level
      # (kaster sees $root.Values.lexicon directly).

# Meta `type: cluster` with backup-by-default — exercises the full bundle:
# Cluster + s3.bucket (VaultSecrets app+provider side) + daily ScheduledBackup.
glyphs:
  postgresql:
    hildy:
      type: cluster
      description: PostgreSQL with auto-backups to VersityGW
      # Opt out of the (default-on) Vault DB engine to keep this example focused
      # on backups (vault IS in this lexicon, so it would be on otherwise).
      dbEngine:
        enabled: false
      instances: 2
      podSecurityContext:
        runAsUser: 26
        runAsGroup: 26
        runAsNonRoot: true
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      dbName: hildy
      userName: hildy
      secret: hildy-pg-app
      storage:
        size: 10Gi
      # No backup: block → all defaults: retention 90d, daily 03:00 UTC,
      # bucket "test-postgresql-databases-hildy-backup", endpoint = lexicon
      # internalEndpoint.
