spellbook:
  name: test-postgresql
  chapters:
    - databases

chapter:
  name: databases

lexicon:
  vault:
    type: secret-store
    provider: operator
    name: vault
    url: http://vault.vault.svc:8200
    namespace: vault
    serviceAccount: vault
    authPath: test-postgresql
    secretPath: kv
    labels:
      default: book
  seaweedfs-s3-provider:
      type: s3-provider
      name: seaweedfs
      namespace: seaweedfs
      serviceAccount: seaweedfs-s3-aggregator-pod
      role: seaweedfs-s3-identities
      endpoint: s3.int.the.yaml.life
      internalEndpoint: http://seaweedfs-s3.seaweedfs.svc:8333
      region: us-east-1
      vault:
        path: /s3-identities
      provider: seaweedfs
      labels:
        default: book

# Both restore modalities side-by-side. Each meta `cluster` here also
# configures its OWN backup destination — the restored data flows in once
# from the source, then the new cluster takes over its own backup stream.
glyphs:
  postgresql:
    # Modality A — convention shortcut. Assumes the source cluster was
    # provisioned with the same meta in the same book/chapter, so the
    # bucket name follows <book>-<chapter>-<source>-backup and the secret
    # follows <source>-backup. Optional PITR via targetTime.
    hildy-restored:
      type: cluster
      description: Restore of hildy via convention
      dbEngine:
        enabled: false   # keep restore example focused (vault is in this lexicon)
      instances: 1
      storage:
        size: 10Gi
      restore:
        from: hildy
        targetTime: "2026-05-19 14:00:00.000000+00"

    # Modality B — explicit. Use for arbitrary origins (off-site DR, a
    # different cluster's bucket, a snapshot promoted from a colder tier).
    # Every field is supplied; nothing is inferred from the lexicon.
    hildy-from-archive:
      type: cluster
      description: Restore of hildy from off-site archive
      dbEngine:
        enabled: false   # keep restore example focused (vault is in this lexicon)
      instances: 1
      storage:
        size: 10Gi
      restore:
        source: hildy-archive
        destinationPath: s3://offsite-archive/hildy
        endpointURL: https://s3.offsite.example.com
        s3SecretRef: hildy-archive-creds
        targetTime: "2026-05-19 14:00:00.000000+00"
