# Basic Service Example
# Tests summon glyph service template generation

name: api-service

labels:
  custom:
    example.com/team: platform
    example.com/component: api
annotations:
  example.com/contact: team@example.com
  example.com/scope: spell

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 80
      protocol: TCP
      name: http
      targetPort: 8080
    - port: 443
      protocol: TCP
      name: https
      targetPort: 8443
  labels:
    example.com/component: ingress
  annotations:
    example.com/scope: service
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
